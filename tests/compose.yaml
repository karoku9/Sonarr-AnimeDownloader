name: anidown-v4

services:
  anidown-v4:
    profiles: [v4-preview]
    build:
      context: ..
      dockerfile: Dockerfile.v4
    image: anidown-v4:latest
    container_name: anidown-v4
    ports:
      - "127.0.0.1:6004:6004"
    volumes:
      - v4-application:/app/work/phase8
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  v4-application:
    name: anidown-v4-application
