name: Test, build, and publish AniDown V4

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true

env:
  IMAGE_NAME: anime_downloader
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements-v4.txt
      - name: Install V4 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v4.txt
      - name: Validate offline preview Compose model
        run: docker compose --profile v4-preview -f docker-compose.yml config --quiet
      - name: Reject duplicate Python tests
        run: python -B tools/check_duplicate_tests.py tests
      - name: Run authoritative V4 backend suite
        run: python -B -m unittest discover -s tests/v4 -p "test_*.py"
      - name: Compile V4 Python sources and tests
        run: python -B -m compileall -q src/v4 tests/v4 tools/check_duplicate_tests.py
      - name: Run authoritative V4 frontend suite
        working-directory: frontend-v4
        run: node --test tests/*.test.mjs

  build_by_digest:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Prepare platform artifact name
        id: names
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          platform="$PLATFORM"
          owner="$REPOSITORY_OWNER"
          docker_user="$DOCKER_USER"
          test -n "$docker_user"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "ghcr_image=ghcr.io/${owner,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "docker_image=${docker_user,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Verify clean source before attestation
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build V4 platform image by immutable digest
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile.v4
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ steps.names.outputs.ghcr_image }}
            ${{ steps.names.outputs.docker_image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: mode=max
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_TREE_STATE=clean
      - name: Smoke the exact amd64 digest before promotion
        if: matrix.platform == 'linux/amd64'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.names.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')" = "anidown"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels \"org.opencontainers.image.title\"}}')" = "AniDown V4"
          python -B -m src.v4.source_manifest --root . --output "$RUNNER_TEMP/SOURCE-MANIFEST.expected.json" --revision "${{ github.sha }}" --tree-state clean
          docker run --rm --entrypoint cat "$IMAGE_REF" /app/SOURCE-MANIFEST.json > "$RUNNER_TEMP/SOURCE-MANIFEST.observed.json"
          cmp --silent "$RUNNER_TEMP/SOURCE-MANIFEST.expected.json" "$RUNNER_TEMP/SOURCE-MANIFEST.observed.json"
          docker run --rm --entrypoint python "$IMAGE_REF" -B -c "import json,pathlib,src.v4.runtime; p=pathlib.Path('/app/SOURCE-MANIFEST.json'); d=json.loads(p.read_text()); assert d['artifact']=='anidown-v4'; assert d['vcs_revision']=='${{ github.sha }}'; assert d['tree_state']=='clean'; assert not pathlib.Path('/app/src/main.py').exists(); assert not pathlib.Path('/app/src/components').exists()"
          docker run --detach --name anidown-v4-release-smoke "$IMAGE_REF"
          trap 'docker rm --force anidown-v4-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec anidown-v4-release-smoke python -B -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:6004/api/v4/overview',timeout=2)); assert d['meta']['contract_version']=='4.1'"; then
              exit 0
            fi
            sleep 1
          done
          docker logs anidown-v4-release-smoke
          exit 1
      - name: Export tested platform digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="$IMAGE_DIGEST"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload platform digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: v4-digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  promote_release:
    needs: build_by_digest
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download tested platform digests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: v4-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Promote only the tested digests
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          DOCKER_IMAGE="${DOCKER_IMAGE,,}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="$RELEASE_VERSION"
          fi
          [[ "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          shopt -s nullglob
          files=("$RUNNER_TEMP"/digests/*)
          test "${#files[@]}" -eq 3
          short_sha="${GITHUB_SHA:0:7}"
          for target in "$GHCR_IMAGE" "$DOCKER_IMAGE"; do
            sources=()
            for file in "${files[@]}"; do
              sources+=("$target@sha256:$(basename "$file")")
            done
            tags=(--tag "$target:$version" --tag "$target:sha-$short_sha")
            if [[ "$version" != "dev" ]]; then tags+=(--tag "$target:latest"); fi
            docker buildx imagetools create "${sources[@]}" "${tags[@]}"
          done
